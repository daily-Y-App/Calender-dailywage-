<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Finance Tracker</title>
    
    <meta name="theme-color" content="#3b0764">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', 'Padauk', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }

        .dot-inc { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 5px rgba(34, 197, 94, 0.5); }
        .dot-exp { width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
    </style>
</head>
<body class="pb-28 text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative">

        <!-- Header -->
        <header class="bg-gradient-to-r from-purple-900 via-purple-800 to-red-700 text-white p-4 rounded-b-3xl shadow-lg sticky top-0 z-40">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <h2 id="userName" class="text-lg font-bold tracking-wide">Loading...</h2>
                    <p id="userCode" class="text-xs text-purple-200 mt-1 bg-white/20 inline-block px-2 py-1 rounded-md">CODE: ---</p>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                    <i class="fa-solid fa-user text-lg"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3">
                <a href="https://daily-y-app.github.io/Dailywage-/" class="bg-white/10 hover:bg-white/20 transition-all border border-white/30 text-center py-2.5 rounded-xl text-sm font-semibold backdrop-blur-md flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-home text-purple-300"></i> Home
                </a>
                <a href="https://daily-y-app.github.io/Battle-wage/" class="bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 transition-all border border-red-400 text-center py-2.5 rounded-xl text-sm font-semibold shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-fire text-yellow-300"></i> Battle
                </a>
            </div>
        </header>

        <main class="p-3 space-y-4">
            <!-- Range Selector Card -->
            <div class="bg-white rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] p-4 border border-gray-100">
                <div class="flex items-center gap-2 mb-4 text-gray-700">
                    <i class="fa-regular fa-calendar-check text-purple-600 text-lg"></i>
                    <p class="text-sm font-bold">ရက်စွဲရွေးချယ်ပြီး စလစ်ထုတ်ရန်</p>
                </div>
                
                <div class="flex items-center gap-2 mb-4">
                    <input type="date" id="startDate" class="flex-1 p-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition-all">
                    <span class="text-gray-400 text-sm font-medium">မှ</span>
                    <input type="date" id="endDate" class="flex-1 p-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition-all">
                </div>
                
                <button onclick="generateRangeSlip()" class="w-full bg-gradient-to-r from-blue-900 to-red-700 hover:from-blue-800 hover:to-red-600 text-white py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-receipt"></i> စလစ်ထုတ်မည်
                </button>
            </div>

            <!-- Calendar View -->
            <div class="bg-white rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] p-3 border border-gray-100">
                <div class="flex justify-between items-center mb-4 bg-gray-50 p-2 rounded-xl">
                    <button onclick="changeMonth(-1)" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h3 id="monthDisplay" class="font-bold text-gray-700 tracking-wide">Month Year</h3>
                    <button onclick="changeMonth(1)" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-colors">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <div class="grid grid-cols-7 gap-1.5" id="calendarGrid">
                </div>
            </div>
        </main>
    </div>

    <!-- Slip Preview Modal -->
    <div id="slipModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="w-full max-w-sm flex flex-col items-center animate-[fadeIn_0.3s_ease-in-out]">
            <!-- Capture Area for Gallery Download -->
            <div id="capture-area" class="bg-white w-full rounded-2xl p-6 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-purple-700 via-red-600 to-red-500"></div>
                
                <div class="text-center border-b border-dashed border-gray-300 pb-3 mb-3 mt-1">
                    <h2 id="slipTypeTitle" class="text-base font-black text-gray-800 tracking-widest uppercase">PAY SLIP</h2>
                    <p id="slipDateRange" class="text-xs text-gray-500 mt-0.5 font-medium"></p>
                </div>
                
                <!-- Dynamic Content Area -->
                <div id="slipContent" class="space-y-3 text-sm text-gray-700 max-h-[55vh] overflow-y-auto pr-1">
                </div>
                
                <!-- Total Calculation -->
                <div class="border-t-2 border-gray-800 mt-4 pt-3 flex justify-between items-center font-bold">
                    <span class="text-gray-800">အသားတင်ကျန်ငွေ</span>
                    <span id="slipTotal" class="text-xl text-purple-700">0฿</span>
                </div>
            </div>
            
            <!-- Modal Actions -->
            <div class="grid grid-cols-2 gap-3 w-full mt-4">
                <button onclick="directDownload()" class="bg-gradient-to-r from-blue-900 to-red-700 hover:from-blue-800 hover:to-red-600 text-white py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> သိမ်းမည်
                </button>
                <button onclick="directShare()" class="bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i> Share
                </button>
                <button onclick="closeModal()" class="col-span-2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-xl font-bold transition-all active:scale-95">
                    ပိတ်မည်
                </button>
            </div>
        </div>
    </div>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let records = JSON.parse(localStorage.getItem('f_recs')) || [];
        let profile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'User', code: 'EMP001', wage: 375, ot: 69 };
        let currentDate = new Date();

        window.onload = () => {
            init();
            syncData(); 
        };

        function init() {
            document.getElementById('userName').innerText = profile.name;
            document.getElementById('userCode').innerText = "CODE: " + profile.code;
            renderCalendar();
        }

        function syncData() {
            if(!profile.code) return;
            
            db.ref('users/' + profile.code).on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    if(data.records) {
                        records = Object.values(data.records);
                        localStorage.setItem('f_recs', JSON.stringify(records));
                    }
                    if(data.profile) {
                        profile = data.profile;
                        localStorage.setItem('f_prof', JSON.stringify(profile));
                        document.getElementById('userName').innerText = profile.name;
                        document.getElementById('userCode').innerText = "CODE: " + profile.code;
                    }
                    renderCalendar(); 
                }
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthDisplay = document.getElementById('monthDisplay');
            grid.innerHTML = "";
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            monthDisplay.innerText = new Intl.DateTimeFormat('my-MM', { month: 'long', year: 'numeric' }).format(currentDate);
            
            const daysOfWeek = ['နေ', 'လာ', 'င်္ဂါ', 'ဗုဒ္ဓ', 'ကြာ', 'သော', 'စနေ'];
            daysOfWeek.forEach(d => {
                grid.innerHTML += `<div class="text-center font-bold text-xs text-purple-400 py-2">${d}</div>`;
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                const dayIncs = records.filter(r => r.date === dateStr && r.type === 'income');
                const dayExps = records.filter(r => r.date === dateStr && r.type === 'expense');
                
                const dayEl = document.createElement('div');
                
                let baseClasses = "aspect-square flex flex-col items-center justify-center text-sm font-medium rounded-xl border border-gray-100 cursor-pointer transition-all hover:bg-purple-50 relative ";
                
                if (dayIncs.length) baseClasses += "bg-green-50/50 ";
                if (dayExps.length) baseClasses += "border-b-4 border-b-red-300 ";
                if (!dayIncs.length && !dayExps.length) baseClasses += "bg-white ";

                dayEl.className = baseClasses;

                let dots = '';
                if(dayIncs.length) dots += '<div class="dot-inc"></div>';
                if(dayExps.length) dots += '<div class="dot-exp"></div>';
                
                const isToday = (new Date().toISOString().split('T')[0] === dateStr);
                const textClass = isToday ? "text-white bg-purple-600 w-6 h-6 rounded-full flex items-center justify-center" : "text-gray-700";

                dayEl.innerHTML = `<span class="${textClass}">${i}</span><div class="flex gap-1 absolute bottom-1">${dots}</div>`;
                
                dayEl.onclick = () => showDailySlip(dateStr);
                grid.appendChild(dayEl);
            }
        }

        // အမျိုးအစား အတိအကျ ခွဲထုတ်ပေးသည့် logic
        function getCategoryName(item) {
            if (item.category) return item.category;
            if (item.title) return item.title;
            if (item.note) return item.note;
            return 'အမျိုးအစားမသတ်မှတ်ရသေး';
        }

        function renderRecordRows(recordsData, color, showDate = false) {
            let total = 0;
            let html = '';
            recordsData.forEach(record => {
                const amount = Number(record.amt || record.amount || 0);
                total += amount;
                const detail = record.title || record.note || record.description || record.memo || '';
                html += `<div class="flex justify-between items-start gap-2 py-2 border-b border-gray-100 last:border-0">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-800">${getCategoryName(record)}</div>
                                ${detail && detail !== getCategoryName(record) ? `<div class="text-[11px] text-gray-500 truncate">${detail}</div>` : ''}
                                ${showDate ? `<div class="text-[10px] text-gray-400">${record.date || ''}</div>` : ''}
                            </div>
                            <span class="${color} font-bold whitespace-nowrap">${(color.includes('green') || color.includes('amber')) ? '+' : '-'}${Math.round(amount)}฿</span>
                         </div>`;
            });
            return { html: html || '<div class="text-xs text-gray-400 py-1">မှတ်တမ်းမရှိပါ</div>', total };
        }

        function recordSearchText(record) {
            return [record.category, record.title, record.note, record.description, record.memo, record.kind].filter(Boolean).join(' ').toLowerCase();
        }

        function isIncomeRecord(record) {
            return record.type === 'income' || record.type === 'ဝင်ငွေ' || record.kind === 'income';
        }

        function isExpenseRecord(record) {
            return record.type === 'expense' || record.type === 'ထွက်ငွေ' || record.kind === 'expense';
        }

        function isOtIncome(record) {
            const text = recordSearchText(record);
            return record.incomePart === 'ot' || (isIncomeRecord(record) && (record.otHours || record.ot || record.otPay || record.overtime || record.kind === 'ot' || text.includes('ot') || text.includes('အချိန်ပို') || text.includes('အချိန်ပိုကြေး') || text.includes('overtime') || text.includes('နာရီဝက်')));
        }

        function isExtraIncome(record) {
            const text = recordSearchText(record);
            return record.incomePart === 'extra' || (isIncomeRecord(record) && !isOtIncome(record) && (record.kind === 'extra_income' || text.includes('အပို') || text.includes('ပိုဝင်') || text.includes('အခြားဝင်ငွေ') || text.includes('bonus') || text.includes('extra') || text.includes('additional') || text.includes('commission')));
        }

        // Home page က income record တစ်ကြောင်းထဲရှိ details { h, o, e } ကို
        // Home ရဲ့တွက်ချက်ပုံအတိုင်း Slip မှာ အမျိုးအစား ၃ မျိုး ခွဲပြသည်။
        function expandHomeIncomeRecords(recordsData) {
            const expanded = [];
            recordsData.forEach(record => {
                const details = record.details || {};
                const hours = Number(details.h) || 0;
                const otHours = Number(details.o) || 0;
                const extraAmount = Number(details.e) || 0;
                const hasHomeBreakdown = hours > 0 || otHours > 0 || extraAmount > 0;
                if (!hasHomeBreakdown) {
                    expanded.push(record);
                    return;
                }
                if (hours > 0) expanded.push({ ...record, category: 'နေ့စားခ', note: `${hours} နာရီ`, amt: (hours / 8) * Number(profile.wage || 0), incomePart: 'regular' });
                if (otHours > 0) expanded.push({ ...record, category: 'OT ဝင်ငွေ', note: `${otHours} နာရီ`, amt: otHours * Number(profile.ot || 0), incomePart: 'ot' });
                if (extraAmount > 0) expanded.push({ ...record, category: 'အပိုဝင်ငွေ', note: 'Home မှတ်တမ်းအပိုဝင်ငွေ', amt: extraAmount, incomePart: 'extra' });
            });
            return expanded;
        }

        function slipSection(title, color, rows, showDate) {
            if (!rows.length) return { html: '', total: 0 };
            const result = renderRecordRows(rows, color, showDate);
            const isIncome = color.includes('green') || color.includes('amber');
            const icon = isIncome ? 'fa-circle-plus' : 'fa-circle-minus';
            return { html: `<div class="${isIncome ? 'bg-green-50/60 border-green-100' : 'bg-red-50/60 border-red-100'} p-2.5 rounded-xl border mb-2">
                                <div class="font-bold ${isIncome ? 'text-green-700 border-green-200/60' : 'text-red-700 border-red-200/60'} text-xs mb-1.5 flex items-center justify-between border-b pb-1">
                                    <span><i class="fa-solid ${icon}"></i> ${title}</span>
                                    <span class="text-[10px]">${rows.length} ကြိမ်</span>
                                </div>${result.html}</div>`, total: result.total };
        }

        // ၁ ရက်စာ အသေးစိတ် စလစ်
        function showDailySlip(date) {
            const dayRecs = records.filter(r => r.date === date);
            if (!dayRecs.length) return;

            document.getElementById('slipTypeTitle').innerText = "DAILY PAY SLIP";
            document.getElementById('slipDateRange').innerText = "ရက်စွဲ - " + date;

            const incs = expandHomeIncomeRecords(dayRecs.filter(isIncomeRecord));
            const exps = dayRecs.filter(isExpenseRecord);

            const ot = incs.filter(isOtIncome);
            const extra = incs.filter(isExtraIncome);
            const regular = incs.filter(r => !isOtIncome(r) && !isExtraIncome(r));
            const regularSection = slipSection('ပုံမှန်ဝင်ငွေ', 'text-green-600', regular, false);
            const otSection = slipSection('OT ဝင်ငွေ', 'text-amber-600', ot, false);
            const extraSection = slipSection('အပိုဝင်ငွေ', 'text-green-600', extra, false);
            const expenseSection = slipSection('ထွက်ငွေ', 'text-red-500', exps, false);
            const totalInc = regularSection.total + otSection.total + extraSection.total;
            const totalExp = expenseSection.total;
            const html = regularSection.html + otSection.html + extraSection.html + expenseSection.html;

            document.getElementById('slipContent').innerHTML = html;
            document.getElementById('slipTotal').innerText = Math.round(totalInc - totalExp) + "฿";

            document.getElementById('slipModal').classList.remove('hidden');
        }

        // ရက်ပိုင်း စလစ်
        function generateRangeSlip() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            if(!start || !end) return alert("ကျေးဇူးပြု၍ ရက်စွဲ အစနှင့် အဆုံးကို ရွေးချယ်ပေးပါ။");
            
            const rangeRecs = records.filter(r => r.date >= start && r.date <= end);
            if(!rangeRecs.length) return alert("ရွေးချယ်ထားသော ရက်အတွင်း မှတ်တမ်းမရှိပါ။");

            const d1 = new Date(start);
            const d2 = new Date(end);
            const diffDays = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            
            document.getElementById('slipTypeTitle').innerText = diffDays + "-DAYS SUMMARY SLIP";
            document.getElementById('slipDateRange').innerText = `${start} မှ ${end} အထိ`;

            const incs = expandHomeIncomeRecords(rangeRecs.filter(isIncomeRecord));
            const exps = rangeRecs.filter(isExpenseRecord);

            const ot = incs.filter(isOtIncome);
            const extra = incs.filter(isExtraIncome);
            const regular = incs.filter(r => !isOtIncome(r) && !isExtraIncome(r));
            const regularSection = slipSection('ပုံမှန်ဝင်ငွေ', 'text-green-600', regular, true);
            const otSection = slipSection('OT ဝင်ငွေ', 'text-amber-600', ot, true);
            const extraSection = slipSection('အပိုဝင်ငွေ', 'text-green-600', extra, true);
            const expenseSection = slipSection('ထွက်ငွေ', 'text-red-500', exps, true);
            const totalInc = regularSection.total + otSection.total + extraSection.total;
            const totalExp = expenseSection.total;
            const html = regularSection.html + otSection.html + extraSection.html + expenseSection.html;

            document.getElementById('slipContent').innerHTML = html;
            document.getElementById('slipTotal').innerText = Math.round(totalInc - totalExp) + "฿";

            document.getElementById('slipModal').classList.remove('hidden');
        }

        function changeMonth(step) { 
            currentDate.setMonth(currentDate.getMonth() + step); 
            renderCalendar(); 
        }
        
        function closeModal() { 
            document.getElementById('slipModal').classList.add('hidden'); 
        }

        // ဖုန်းဂယ်လာရီထဲ ပုံတိုက်ရိုက်ဒေါင်းလုဒ်ဆွဲခြင်း
        async function directDownload() {
            const area = document.getElementById('capture-area');
            try {
                const canvas = await html2canvas(area, { 
                    scale: 3, 
                    useCORS: true, 
                    backgroundColor: "#ffffff",
                    logging: false
                });
                
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = image;
                link.download = `pay-slip-${Date.now()}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                alert("စလစ်ပုံသိမ်းဆည်းရာတွင် အမှားတစ်ခုရှိနေပါသည်: " + err);
            }
        }

        // မည်သည့် App သို့မဆို တိုက်ရိုက် Share ပြုလုပ်ခြင်း
        async function directShare() {
            const area = document.getElementById('capture-area');
            try {
                const canvas = await html2canvas(area, { scale: 3, useCORS: true, backgroundColor: "#ffffff" });
                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `slip-${Date.now()}.png`, { type: 'image/png' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { 
                            await navigator.share({ 
                                files: [file], 
                                title: 'Pay Slip',
                                text: 'Finance Pay Slip'
                            }); 
                        } catch (err) { 
                            if (err.name !== 'AbortError') directDownload(); 
                        }
                    } else if (navigator.share) {
                        try {
                            await navigator.share({
                                title: 'Pay Slip',
                                text: 'Finance Pay Slip'
                            });
                        } catch (err) {
                            directDownload();
                        }
                    } else { 
                        directDownload(); 
                    }
                }, 'image/png');
